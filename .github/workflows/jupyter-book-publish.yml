name: Publish Jupyter Book

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Forzar publicación (saltar tests)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install ".[latex]"

      - name: Test with pytest
        run: |
          pytest

  publish:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book ghp-import ".[latex]"

      - name: Configure git authentication
        run: |
          git config --global user.email "turulomio@yahoo.es" #gh-pages branch
          git config --global user.name "turulomio"

      - name: Build Jupyter Book
        run: |
          cd jupyter
          BASE_URL=/pydicts jupyter book build --html --execute

      - name: Upload artifact to pass to GitHub Pages
        run: |
          cd jupyter
          ghp-import -n -p -f _build/html